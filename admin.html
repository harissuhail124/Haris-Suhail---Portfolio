<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-6">

  <!-- Login Form -->
  <div id="login-box" class="bg-gray-800 p-8 rounded-xl shadow-lg w-96 border border-gray-700">
    <h2 class="text-2xl font-bold mb-6 text-center">Admin Login</h2>
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm mb-2">Email</label>
        <input type="email" id="login-email" class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600 focus:outline-none" required />
      </div>
      <div>
        <label class="block text-sm mb-2">Password</label>
        <input type="password" id="login-password" class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600 focus:outline-none" required />
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded font-semibold transition">Login</button>
    </form>
  </div>

  <!-- Blog Creator Dashboard (Hidden until logged in) -->
  <div id="dashboard-box" class="hidden max-w-2xl w-full bg-gray-800 p-8 rounded-xl border border-gray-700">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Create New Blog Post</h1>
      <button id="logout-btn" class="bg-red-600 px-3 py-1 rounded text-sm">Logout</button>
    </div>
    <form id="blog-form" class="space-y-4">
      <div>
        <label class="block text-sm mb-2">Post Title</label>
        <input type="text" id="blog-title" class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600" required />
      </div>
      <div>
        <label class="block text-sm mb-2">Content</label>
        <textarea id="blog-content" rows="6" class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600" required></textarea>
      </div>
      <button type="submit" class="w-full bg-indigo-600 py-2 rounded font-semibold">Publish Post</button>
    </form>
  </div>

  <script type="module" src="./admin.js"></script>
</body>
</html>
